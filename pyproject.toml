[project]
name = "vv4ml"
version = "0.1.3a1"
requires-python = ">=3.14"
authors = [
    { name = "Cristiano Epifania", email = "c.epifania5@studenti.uniba.it" }
]
description = "A solid verification and validation python library for ml models"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "catboost>=1.2.10",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.13.3",
    "pydantic-yaml>=1.6.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.12",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I", "N"]
