[project]
name = "vv4ml"
version = "1.0.3"
requires-python = ">=3.12"
authors = [
    { name = "Cristiano Epifania", email = "c.epifania5@studenti.uniba.it" }
]
description = "A solid verification and validation python library for ml models"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "catboost>=1.2.10",
    "ipykernel>=7.3.0",
    "mlflow-skinny>=3.12.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pydantic>=2.13.3",
    "pydantic-yaml>=1.6.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "mkdocs",
    "mkdocstrings[python]>=0.18",
    "mathjax",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I", "N"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vv4ml*"]
exclude = ["vv4ml.tests*"]
