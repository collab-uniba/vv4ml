dataset:
  name: "synthetic_dataset"
  path: "mock_data.csv"
  source: "sklearn_generator"
  provenance: "vv4ml"
  version: "1.0.0"
  file_format: "csv"
  format_metadata:
    delimiter: ","
    decimal_separator: "."
    header_lines: 1
    encoding: "UTF-8"
  inputs:
    - name: "feature_1"
      data_type: "float"
      range: [-4.0, 4.0]
      units: "adimensional"
    - name: "feature_2"
      data_type: "float"
      range: [-4.0, 4.0]
      units: "adimensional"
    - name: "feature_3"
      data_type: "float"
      range: [-4.0, 4.0]
      units: "adimensional"
  outputs:
    - name: "target"
      data_type: "float"
      range: [1.0, 2.0]
      units: "adimensional"

gate_thresholds:
  validation:
    - field: "target"
      metric: "RMSE"
      value: 0.15
  verification:
    convergence:
      - field: "target"
        metric: "MeanRelativeError"
        value: 0.02
    smoothness:
      - field: "target"
        metric: "MaximumRelativeErrorRatio"
        value: 2.5
    numerical_error:
      - field: "target"
        metric: "MaxStandardDeviation"
        value: 0.5

test_configurations:
  verification:
    convergence:
      n_rows: [50, 100, 200, 300]
    existence:
      samples: 100
    smoothness:
      sample_fraction: 0.2
      perturbation_scaled_magnitude: 0.001
    numerical_error:
      sets: 20

model_development:
  train_test_split:
    train_fraction: 0.4
    method: "random"
  preprocessing:
    normalization: false
    standardization: false
  optimization:
    optimization_method: "GridSearch"
    n_jobs: -1
    cv: 5
  model_list:
    - type: "RandomForestRegressor"
      label: "rf_reference_model"
      hyperparameters:
        n_estimators: 150
        max_depth: 5
        min_samples_leaf: 8
        random_state: 42